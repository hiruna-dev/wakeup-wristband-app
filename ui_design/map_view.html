<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Saved Locations Map View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-bg': '#1f2128',
            'primary-purple': '#9353d3',
            'secondary-purple': '#a05aff',
            'text-gray': '#9ca3af',
            'glass-bg': 'rgba(230, 235, 245, 0.9)',
          },
          boxShadow: {
            'glow': '0 0 15px rgba(160, 90, 255, 0.4)',
            'search': '0 4px 15px rgba(0, 0, 0, 0.2)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">/* Hide scrollbar for clean app look */
::-webkit-scrollbar {
    display: none
    }
/* Map Background Styling */
.map-container {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCm-_yw5oRZwA3wr0vk_JpbvjI73G69xwYRh0loacal8gDnSUI-vuWzw4jDq9Py_TI9ov6WbYUzMiCFPIZwPocW5SMdCpdniBwLzOhCz7Uw9-bPMrTGBk6zefSdAMD58J_PvACRXxn66NRrp_QT_4TBlkubbskf9hSZJDrPWKekUt6qtuj3DjVbc80Kz4dwhDuezpUlDUWIDseuIPxQMgLd0dbBisQylEeBi8fWsYnACQlHpELFQUn3lo-ChlXA_a3tGmhGhl1KR6UB);
    background-size: cover;
    background-position: center;
    /* Applying a dark blue/gray tint to simulate dark map mode */
    position: relative
    }
.map-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(31, 33, 40, 0.7);
    /* Dark overlay */
    mix-blend-mode: multiply;
    pointer-events: none
    }
/* Tooltip arrow */
.tooltip-arrow::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translatex(-50%);
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: white transparent transparent transparent;
    display: block;
    width: 0
    }
/* iOS Home Indicator */
.home-indicator {
    width: 134px;
    height: 5px;
    background-color: #fff;
    border-radius: 100px;
    margin: 8px auto
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-dark-bg text-white h-screen flex flex-col overflow-hidden antialiased">
<!-- BEGIN: Header & Status Bar -->
<header class="bg-dark-bg z-20 pt-2 pb-4 px-6 flex flex-col shadow-md relative">
<!-- Status Bar -->
<div class="flex justify-between items-center text-[15px] font-semibold mb-3">
<span>9:45</span>
<div class="flex items-center space-x-2">
<i class="fa-solid fa-signal text-xs"></i>
<i class="fa-solid fa-wifi text-sm"></i>
<i class="fa-solid fa-battery-full text-lg"></i>
</div>
</div>
<!-- Title -->
<h1 class="text-center text-[17px] font-medium tracking-wide">Saved Locations Map View</h1>
</header>
<!-- END: Header & Status Bar -->
<!-- BEGIN: Main Map Area -->
<main class="flex-grow relative map-container z-10">
<!-- Search Bar Overlay -->
<div class="absolute top-4 left-4 right-4 z-30">
<div class="rounded-full shadow-search flex items-center px-4 py-3 border border-white/20" style="background-color: rgba(90, 95, 120, 0.6); backdrop-filter: blur(12px);">
<div class="flex-grow flex items-center bg-gray-600/30 rounded-full px-4 py-2 mr-3">
<i class="fa-solid fa-magnifying-glass text-primary-purple text-lg mr-3"></i>
<input class="bg-transparent border-none text-white placeholder-gray-300 w-full focus:ring-0 text-[15px] p-0" placeholder="Search for a location" readonly="" type="text"/>
</div>
<button class="p-2 text-[#8c52ff] text-xl">
<i class="fa-solid fa-filter"></i>
</button>
</div>
</div>
<!-- Map Markers (Positioned absolutely for demo purposes) -->
<!-- Marker 1 (Top Right) -->
<div class="absolute top-[25%] right-[20%] flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2 z-20 cursor-pointer">
<svg fill="none" height="32" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z" fill="#8c52ff"></path>
</svg>
</div>
<!-- Marker 2 (Left Middle) -->
<div class="absolute top-[45%] left-[15%] flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2 z-20 cursor-pointer">
<svg fill="none" height="32" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z" fill="#8c52ff"></path>
</svg>
</div>
<!-- Marker 3 (Bottom Left) -->
<div class="absolute bottom-[35%] left-[30%] flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2 z-20 cursor-pointer">
<svg fill="none" height="32" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z" fill="#8c52ff"></path>
</svg>
</div>
<!-- Marker 4 (Center - Active with Tooltip) -->
<div class="absolute top-[50%] left-[50%] flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2 z-40">
<div class="flex flex-col items-center mb-1">
<div class="bg-white rounded-xl shadow-glow text-center min-w-[140px] overflow-hidden">
<div class="p-3 pb-2">
<h3 class="text-black font-semibold text-[15px] leading-tight">Central Park</h3>
<p class="text-gray-500 text-xs mt-0.5">Saved Location</p>
</div>
<div class="h-px w-full bg-gray-200"></div>
<button class="w-full py-2.5 text-center text-[#8c52ff] text-[15px] font-medium active:bg-gray-50 transition-colors flex justify-center items-center">
          Navigate
        </button>
</div>
<div class="w-0 h-0 border-l-8 border-r-8 border-t-8 border-transparent border-t-white mx-auto drop-shadow-md"></div>
</div>
<svg fill="none" height="36" viewbox="0 0 24 24" width="36" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z" fill="#8c52ff"></path>
</svg>
</div>
<!-- Floating Action Button (FAB) -->
<button class="absolute bottom-6 right-6 w-14 h-14 bg-white rounded-full shadow-lg flex items-center justify-center z-30 active:scale-95 transition-transform">
<i class="fa-solid fa-location-arrow text-primary-purple text-xl -rotate-45 ml-1 mb-1"></i>
</button>
</main>
<!-- END: Main Map Area -->
<!-- BEGIN: Bottom Navigation -->
<footer class="bg-dark-bg z-20 pt-2 pb-1 relative">
<!-- Active Tab Indicator Line -->
<div class="absolute top-0 left-0 w-1/3 h-1 bg-secondary-purple shadow-[0_0_8px_rgba(160,90,255,0.8)]"></div>
<nav class="flex justify-around items-center pt-3 pb-2">
<!-- Home (Active) -->
<button class="flex flex-col items-center space-y-1 w-1/3">
<i class="fa-solid fa-house text-secondary-purple text-xl"></i>
<span class="text-[10px] text-secondary-purple font-medium">Home</span>
</button>
<!-- Analytics -->
<button class="flex flex-col items-center space-y-1 w-1/3">
<i class="fa-solid fa-chart-line text-text-gray text-xl"></i>
<span class="text-[10px] text-text-gray font-medium">Analytics</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center space-y-1 w-1/3">
<i class="fa-solid fa-gear text-text-gray text-xl"></i>
<span class="text-[10px] text-text-gray font-medium">Settings</span>
</button>
</nav>
<!-- iOS Home Indicator -->
<div class="w-full pb-2">
<div class="home-indicator"></div>
</div>
</footer>
<!-- END: Bottom Navigation -->
</body></html>
